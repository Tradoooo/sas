<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#444"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#2f7d2f"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#222">Sas — architecture (spec §20.1)</text>

  <!-- ================= Customer account ================= -->
  <rect x="20" y="50" width="250" height="380" rx="8" fill="#e8f1fb" stroke="#5b8cc9"/>
  <text x="32" y="72" font-size="13" font-weight="bold" fill="#28508c">Customer AWS account</text>

  <rect x="40" y="90" width="210" height="52" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="52" y="114" font-size="13" font-weight="bold" fill="#222">Third-party agent</text>
  <text x="52" y="131" font-size="11" fill="#555">vendor image / package</text>

  <rect x="40" y="180" width="210" height="52" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="52" y="204" font-size="13" font-weight="bold" fill="#222">Real resources</text>
  <text x="52" y="221" font-size="11" fill="#555">buckets, tables, tools</text>

  <rect x="40" y="270" width="210" height="52" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="52" y="294" font-size="13" font-weight="bold" fill="#222">Shadow replica</text>
  <text x="52" y="311" font-size="11" fill="#555">synthetic data, decoys</text>

  <text x="32" y="360" font-size="11" fill="#28508c">no outbound route except</text>
  <text x="32" y="375" font-size="11" fill="#28508c">the gateway (shadow mode)</text>

  <!-- ================= MSP account ================= -->
  <rect x="320" y="50" width="660" height="690" rx="8" fill="#f0f7f0" stroke="#5b9b5b"/>
  <text x="332" y="72" font-size="13" font-weight="bold" fill="#2c5e2c">MSP AWS account — control plane and sandboxes</text>

  <!-- control plane -->
  <rect x="360" y="90" width="190" height="48" rx="5" fill="#eef7fa" stroke="#5aa6c9"/>
  <text x="372" y="111" font-size="13" font-weight="bold" fill="#1d4e63">Portal</text>
  <text x="372" y="127" font-size="11" fill="#555">CloudFront + S3 + Cognito</text>

  <rect x="360" y="158" width="190" height="48" rx="5" fill="#eef7fa" stroke="#5aa6c9"/>
  <text x="372" y="179" font-size="13" font-weight="bold" fill="#1d4e63">API</text>
  <text x="372" y="195" font-size="11" fill="#555">API Gateway + Lambda</text>

  <rect x="360" y="226" width="190" height="48" rx="5" fill="#eef7fa" stroke="#5aa6c9"/>
  <text x="372" y="247" font-size="13" font-weight="bold" fill="#1d4e63">Manifest service</text>
  <text x="372" y="263" font-size="11" fill="#555">validation, versioning</text>

  <rect x="580" y="158" width="300" height="48" rx="5" fill="#eef7fa" stroke="#5aa6c9"/>
  <text x="592" y="179" font-size="13" font-weight="bold" fill="#1d4e63">Replay orchestration</text>
  <text x="592" y="195" font-size="11" fill="#555">Step Functions / in-process loop</text>

  <!-- AgentCore -->
  <rect x="360" y="300" width="520" height="280" rx="8" fill="#f3edfb" stroke="#8a63c9"/>
  <text x="372" y="322" font-size="13" font-weight="bold" fill="#4b2c7a">AgentCore — the airlock</text>

  <rect x="380" y="340" width="232" height="58" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="392" y="365" font-size="13" font-weight="bold" fill="#222">Runtime</text>
  <text x="392" y="383" font-size="11" fill="#555">isolated sessions, one per replay</text>

  <rect x="628" y="340" width="232" height="58" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="640" y="365" font-size="13" font-weight="bold" fill="#222">Identity</text>
  <text x="640" y="383" font-size="11" fill="#555">ephemeral identity per session</text>

  <rect x="380" y="420" width="232" height="58" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="392" y="445" font-size="13" font-weight="bold" fill="#222">Policy</text>
  <text x="392" y="463" font-size="11" fill="#555">perimeter derived from the manifest</text>

  <rect x="628" y="420" width="232" height="58" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="640" y="445" font-size="13" font-weight="bold" fill="#222">Gateway</text>
  <text x="640" y="463" font-size="11" fill="#555">every tool call passes here</text>

  <rect x="380" y="500" width="232" height="58" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="392" y="525" font-size="13" font-weight="bold" fill="#222">Memory</text>
  <text x="392" y="543" font-size="11" fill="#555">cross-replay state, declared only</text>

  <rect x="628" y="500" width="232" height="58" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="640" y="525" font-size="13" font-weight="bold" fill="#222">Observability</text>
  <text x="640" y="543" font-size="11" fill="#555">complete, chained journal</text>

  <!-- analysis / storage -->
  <rect x="390" y="600" width="200" height="54" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="402" y="624" font-size="13" font-weight="bold" fill="#222">Analyzer</text>
  <text x="402" y="642" font-size="11" fill="#555">aggregate → classify → compose</text>

  <rect x="650" y="600" width="220" height="54" rx="5" fill="#ffffff" stroke="#999" stroke-dasharray="4,2"/>
  <text x="662" y="624" font-size="13" font-weight="bold" fill="#666">Behavioural signature</text>
  <text x="662" y="642" font-size="11" fill="#777">drift detection (design only)</text>

  <rect x="390" y="672" width="250" height="46" rx="5" fill="#ffffff" stroke="#666"/>
  <text x="402" y="694" font-size="13" font-weight="bold" fill="#222">DynamoDB / S3</text>
  <text x="402" y="710" font-size="11" fill="#555">manifests, sessions, proofs, journals</text>

  <rect x="670" y="672" width="200" height="46" rx="5" fill="#ffffff" stroke="#999" stroke-dasharray="4,2"/>
  <text x="682" y="694" font-size="13" font-weight="bold" fill="#666">Amazon Quick</text>
  <text x="682" y="710" font-size="11" fill="#777">fleet registry, trends</text>

  <!-- ================= edges ================= -->
  <line x1="455" y1="138" x2="455" y2="158" stroke="#444" marker-end="url(#arr)"/>
  <line x1="455" y1="206" x2="455" y2="226" stroke="#444" marker-end="url(#arr)"/>
  <line x1="550" y1="182" x2="580" y2="182" stroke="#444" marker-end="url(#arr)"/>
  <line x1="730" y1="206" x2="730" y2="300" stroke="#444" marker-end="url(#arr)"/>

  <line x1="612" y1="369" x2="628" y2="369" stroke="#444" marker-end="url(#arr)"/>
  <line x1="496" y1="398" x2="496" y2="500" stroke="#444" marker-end="url(#arr)"/>
  <line x1="612" y1="449" x2="580" y2="449" stroke="#444" marker-end="url(#arr)"/>
  <line x1="744" y1="478" x2="744" y2="500" stroke="#444" marker-end="url(#arr)"/>

  <!-- gateway -> observability (journal) -->
  <line x1="650" y1="478" x2="650" y2="500" stroke="#444" marker-end="url(#arr)"/>

  <!-- observability -> analyzer -->
  <line x1="620" y1="558" x2="520" y2="600" stroke="#444" marker-end="url(#arr)"/>

  <!-- analyzer -> signature, analyzer -> storage, storage -> quick -->
  <line x1="590" y1="627" x2="650" y2="627" stroke="#444" marker-end="url(#arr)"/>
  <line x1="515" y1="654" x2="515" y2="672" stroke="#444" marker-end="url(#arr)"/>
  <line x1="640" y1="695" x2="670" y2="695" stroke="#444" marker-end="url(#arr)"/>

  <!-- agent -> gateway (long) -->
  <line x1="250" y1="116" x2="628" y2="449" stroke="#444" marker-end="url(#arr)"/>
  <text x="430" y="250" font-size="11" fill="#444" transform="rotate(42 430 250)">tool calls</text>

  <!-- policy -- allowed --> replica / real (dashed green) -->
  <line x1="380" y1="449" x2="250" y2="122" stroke="#2f7d2f" stroke-dasharray="6,4" marker-end="url(#arrA)"/>
  <line x1="380" y1="449" x2="250" y2="206" stroke="#2f7d2f" stroke-dasharray="6,4" marker-end="url(#arrA)"/>
  <text x="300" y="250" font-size="11" fill="#2f7d2f">allowed (shadow → replica)</text>

  <!-- policy -- denied --> observability (red) -->
  <line x1="496" y1="478" x2="636" y2="529" stroke="#b23b3b" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="505" y="500" font-size="11" fill="#b23b3b">denied</text>

  <!-- legend -->
  <text x="20" y="470" font-size="12" font-weight="bold" fill="#222">Legend</text>
  <line x1="20" y1="486" x2="50" y2="486" stroke="#444" marker-end="url(#arr)"/>
  <text x="56" y="490" font-size="11" fill="#444">implemented (offline, local backend)</text>
  <line x1="20" y1="506" x2="50" y2="506" stroke="#999" stroke-dasharray="4,2"/>
  <text x="56" y="510" font-size="11" fill="#666">design only / not in the tree</text>
  <line x1="20" y1="526" x2="50" y2="526" stroke="#2f7d2f" stroke-dasharray="6,4"/>
  <text x="56" y="530" font-size="11" fill="#2f7d2f">Policy → allowed</text>
  <line x1="20" y1="546" x2="50" y2="546" stroke="#b23b3b" stroke-dasharray="4,3"/>
  <text x="56" y="550" font-size="11" fill="#b23b3b">Policy → denied (journaled)</text>
</svg>